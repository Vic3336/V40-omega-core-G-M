name: V40 MESH CORE - Ejecución de Malla Descentralizada en la Nube

on:
  workflow_dispatch:
    inputs:
      target_host:
        description: 'Dirección IP o URL del nodo Master'
        required: true
        default: '127.0.0.1'
      node_count:
        description: 'Número de nodos concurrentes en paralelo'
        required: true
        default: '5'

jobs:
  run-mesh:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4

    # Forzamos la instalación de dependencias nativas del sistema que compilan SciPy/NumPy
    - name: Configurar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-dev build-essential

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Compilar e Instalar Gema
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    # Corrección de sintaxis estricta: Extracción directa mediante el objeto inputs corporativo
    - name: Despachar Malla Descentralizada
      run: |
        gema-v40 mesh --host "${{ inputs.target_host }}" --nodes ${{ inputs.node_count }}
        
